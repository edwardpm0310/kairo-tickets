<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo Tickets</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #2c3e50; height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 300px; background: white; border-right: 1px solid #e0e6ed; display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #e0e6ed; flex-shrink: 0; }
    .sidebar-header h1 { font-size: 18px; color: #2c3e50; margin-bottom: 4px; }
    .sidebar-header p { font-size: 12px; color: #95a5a6; }
    .menu-vertical { padding: 8px; border-bottom: 1px solid #e0e6ed; flex-shrink: 0; }
    .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 8px; cursor: pointer; color: #5a6c7d; font-size: 13px; font-weight: 600; transition: all 0.15s; margin-bottom: 2px; }
    .menu-item:hover { background: #f0f3f7; }
    .menu-item.activo { background: #d6eaf8; color: #2874a6; }
    .menu-item-izq { display: flex; align-items: center; gap: 10px; }
    .menu-item-icono { font-size: 16px; width: 20px; text-align: center; }
    .menu-item-badge { background: #e0e6ed; color: #5a6c7d; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; min-width: 24px; text-align: center; }
    .menu-item.activo .menu-item-badge { background: #2874a6; color: white; }
    .sidebar-lista { flex: 1; overflow-y: auto; padding: 8px; scrollbar-width: thin; }
    .sidebar-lista::-webkit-scrollbar { width: 6px; }
    .sidebar-lista::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 3px; }
    .ticket-item { padding: 12px 14px; border-radius: 8px; margin-bottom: 6px; cursor: pointer; background: #fafbfc; border-left: 4px solid #ddd; transition: all 0.15s; min-height: 70px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
    .ticket-item:hover { background: #f0f3f7; }
    .ticket-item.seleccionado { background: #ebf5fb; }
    .ticket-item.prioridad-alta { border-left-color: #e74c3c; }
    .ticket-item.prioridad-media { border-left-color: #f1c40f; }
    .ticket-item.prioridad-baja { border-left-color: #27ae60; }
    .ticket-titulo { font-size: 13px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ticket-titulo.prioridad-alta { color: #c0392b; }
    .ticket-titulo.prioridad-media { color: #b7950b; }
    .ticket-titulo.prioridad-baja { color: #1e8449; }
    .detalle { flex: 1; display: flex; flex-direction: column; background: #f5f7fa; overflow: hidden; }
    .detalle-header { background: white; padding: 24px; border-bottom: 1px solid #e0e6ed; }
    .detalle-header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 12px; }
    .detalle-titulo { font-size: 20px; font-weight: 700; color: #2c3e50; flex: 1; }
    .detalle-urgencia { padding: 6px 14px; border-radius: 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .detalle-urgencia.alta { background: #fde8e6; color: #c0392b; }
    .detalle-urgencia.media { background: #fef9e7; color: #b7950b; }
    .detalle-urgencia.baja { background: #e8f8f0; color: #1e8449; }
    .detalle-meta { display: flex; gap: 20px; font-size: 13px; color: #7f8c8d; flex-wrap: wrap; }
    .detalle-meta-item { display: flex; align-items: center; gap: 6px; }
    .detalle-body { flex: 1; overflow-y: auto; padding: 24px; }
    .seccion { background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .seccion-titulo { font-size: 11px; font-weight: 700; color: #95a5a6; text-transform: uppercase; margin-bottom: 12px; }
    .seccion-contenido { font-size: 14px; color: #34495e; line-height: 1.6; }
    .detalle-footer { background: white; padding: 20px 24px; border-top: 1px solid #e0e6ed; }
    .acciones-principales { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .btn { flex: 1; min-width: 120px; padding: 12px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; color: white; transition: all 0.2s; }
    .btn:hover { transform: translateY(-1px); }
    .btn-aprobar { background: #27ae60; }
    .btn-rechazar { background: #e74c3c; }
    .btn-completar { background: #3498db; }
    .btn-reabrir { background: #f39c12; }
    .acciones-secundarias { display: flex; gap: 8px; }
    .btn-secundario { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #e0e6ed; background: white; color: #5a6c7d; font-size: 12px; font-weight: 600; cursor: pointer; }
    .vacio { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #95a5a6; text-align: center; padding: 40px; }
    .vacio-icono { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
    .vacio-texto { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .vacio-subtexto { font-size: 13px; color: #bdc3c7; }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; color: #95a5a6; }
    .spinner { width: 30px; height: 30px; border: 3px solid #e0e6ed; border-top-color: #3498db; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>🎟️ Kairo Tickets</h1>
        <p>Sistema de solicitudes</p>
      </div>
      <div class="menu-vertical">
        <div class="menu-item activo" id="menu-pendiente" onclick="cambiarTab('Pendiente')">
          <div class="menu-item-izq"><span class="menu-item-icono">📥</span><span>Pendientes</span></div>
          <span class="menu-item-badge" id="badge-pendientes">0</span>
        </div>
        <div class="menu-item" id="menu-aprobado" onclick="cambiarTab('Aprobado')">
          <div class="menu-item-izq"><span class="menu-item-icono">✅</span><span>Aprobados</span></div>
          <span class="menu-item-badge" id="badge-aprobados">0</span>
        </div>
        <div class="menu-item" id="menu-rechazado" onclick="cambiarTab('Rechazado')">
          <div class="menu-item-izq"><span class="menu-item-icono">❌</span><span>Rechazados</span></div>
          <span class="menu-item-badge" id="badge-rechazados">0</span>
        </div>
        <div class="menu-item" id="menu-completado" onclick="cambiarTab('Completado')">
          <div class="menu-item-izq"><span class="menu-item-icono">✔️</span><span>Completados</span></div>
          <span class="menu-item-badge" id="badge-completados">0</span>
        </div>
      </div>
      <div class="sidebar-lista" id="sidebar-lista">
        <div class="loading"><div class="spinner"></div><div>Cargando...</div></div>
      </div>
    </div>
    <div class="detalle" id="detalle">
      <div class="vacio">
        <div class="vacio-icono">👈</div>
        <div class="vacio-texto">Selecciona un ticket</div>
        <div class="vacio-subtexto">Elige una solicitud de la lista</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxvEvv1VAEaAr_fZ2OZVbQ1-Ww4Ywv3OUKwXjOEth2K3Zxfk8Il8A2jVoZsFgqyToxK/exec';
    const API_KEY = 'kairo_secret_2026_xyz123';
    
    let todosLosTickets = [];
    let tabActual = 'Pendiente';
    let ticketSeleccionado = null;
    
    function cargarTickets() {
      document.getElementById('sidebar-lista').innerHTML = 
        '<div class="loading"><div class="spinner"></div><div>Cargando...</div></div>';
      
      fetch(API_URL + '?key=' + API_KEY)
        .then(response => response.json())
        .then(data => mostrarTickets(data))
        .catch(error => mostrarError({ message: error.message }));
    }
    
    function mostrarTickets(tickets) {
      todosLosTickets = tickets || [];
      if (todosLosTickets.error) { mostrarError({ message: todosLosTickets.error }); return; }
      actualizarBadges();
      renderizarLista();
    }
    
    function mostrarError(error) {
      document.getElementById('sidebar-lista').innerHTML =
        '<div class="vacio"><div class="vacio-icono">❌</div>' +
        '<div class="vacio-texto">Error</div>' +
        '<div class="vacio-subtexto">' + (error.message || 'Error') + '</div>' +
        '<button class="btn btn-completar" style="margin-top:16px;max-width:200px;" onclick="cargarTickets()">🔄 Reintentar</button></div>';
    }
    
    function actualizarBadges() {
      const t = todosLosTickets || [];
      document.getElementById('badge-pendientes').textContent = t.filter(x => x.estado === 'Pendiente').length;
      document.getElementById('badge-aprobados').textContent = t.filter(x => x.estado === 'Aprobado').length;
      document.getElementById('badge-rechazados').textContent = t.filter(x => x.estado === 'Rechazado').length;
      document.getElementById('badge-completados').textContent = t.filter(x => x.estado === 'Completado').length;
    }
    
    function cambiarTab(estado) {
      tabActual = estado;
      document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('activo'));
      document.getElementById('menu-' + estado.toLowerCase()).classList.add('activo');
      renderizarLista();
    }
    
    function renderizarLista() {
      const t = todosLosTickets || [];
      let filtrados = t.filter(x => x.estado === tabActual);
      
      const orden = { 'alta': 1, 'media': 2, 'baja': 3 };
      filtrados.sort((a, b) => (orden[obtenerPrioridad(a.urgencia)] || 4) - (orden[obtenerPrioridad(b.urgencia)] || 4));
      
      const contenedor = document.getElementById('sidebar-lista');
      
      if (filtrados.length === 0) {
        contenedor.innerHTML = '<div class="vacio"><div class="vacio-icono">✨</div><div class="vacio-texto">No hay tickets</div><div class="vacio-subtexto">en esta categoría</div></div>';
        return;
      }
      
      contenedor.innerHTML = filtrados.map(ticket => {
        const p = obtenerPrioridad(ticket.urgencia);
        const sel = ticketSeleccionado && ticketSeleccionado.fila === ticket.fila;
        return `<div class="ticket-item prioridad-${p} ${sel ? 'seleccionado' : ''}" onclick="seleccionarTicket(${ticket.fila})"><div class="ticket-titulo prioridad-${p}">${ticket.solicitud}</div></div>`;
      }).join('');
    }
    
    function seleccionarTicket(fila) {
      ticketSeleccionado = (todosLosTickets || []).find(t => t.fila === fila);
      renderizarLista();
      renderizarDetalle();
    }
    
    function renderizarDetalle() {
      const t = ticketSeleccionado;
      if (!t) return;
      const p = obtenerPrioridad(t.urgencia);
      const fecha = t.fecha ? new Date(t.fecha).toLocaleDateString('es-PE') : 'Sin fecha';
      
      let acciones = '';
      if (t.estado === 'Pendiente') {
        acciones = `<button class="btn btn-aprobar" onclick="cambiarEstado('Aprobado')">✅ Aprobar</button><button class="btn btn-rechazar" onclick="cambiarEstado('Rechazado')">❌ Rechazar</button>`;
      } else if (t.estado === 'Aprobado') {
        acciones = `<button class="btn btn-completar" onclick="cambiarEstado('Completado')">✔️ Completar</button><button class="btn btn-rechazar" onclick="cambiarEstado('Rechazado')">❌ Rechazar</button><button class="btn btn-reabrir" onclick="cambiarEstado('Pendiente')">🔄 Reabrir</button>`;
      } else if (t.estado === 'Rechazado') {
        acciones = `<button class="btn btn-aprobar" onclick="cambiarEstado('Aprobado')">✅ Aprobar</button><button class="btn btn-reabrir" onclick="cambiarEstado('Pendiente')">🔄 Reabrir</button>`;
      } else if (t.estado === 'Completado') {
        acciones = `<button class="btn btn-reabrir" onclick="cambiarEstado('Pendiente')">🔄 Reabrir</button>`;
      }
      
      document.getElementById('detalle').innerHTML = `
        <div class="detalle-header">
          <div class="detalle-header-top">
            <div class="detalle-titulo">${t.solicitud}</div>
            <div class="detalle-urgencia ${p}">${t.urgencia}</div>
          </div>
          <div class="detalle-meta">
            <div class="detalle-meta-item">👤 ${t.nombre}</div>
            <div class="detalle-meta-item">📅 ${fecha}</div>
            <div class="detalle-meta-item">🆔 #${t.fila - 1}</div>
            <div class="detalle-meta-item">📊 <strong>${t.estado}</strong></div>
          </div>
        </div>
        <div class="detalle-body">
          ${t.notas ? '<div class="seccion"><div class="seccion-titulo">📝 Notas</div><div class="seccion-contenido">' + t.notas + '</div></div>' : ''}
        </div>
        <div class="detalle-footer">
          <div class="acciones-principales">${acciones}</div>
          <div class="acciones-secundarias">
            <button class="btn-secundario" onclick="cargarTickets()">🔄 Actualizar</button>
          </div>
        </div>`;
    }
    
    function obtenerPrioridad(u) {
      u = (u || '').toLowerCase();
      if (u.includes('alta') || u.includes('crítica')) return 'alta';
      if (u.includes('media')) return 'media';
      return 'baja';
    }
    
    function cambiarEstado(estado) {
      if (!ticketSeleccionado) return;
      fetch(API_URL + '?key=' + API_KEY + '&action=update&fila=' + ticketSeleccionado.fila + '&estado=' + estado)
        .then(() => cargarTickets())
        .catch(e => alert('Error: ' + e.message));
    }
    
    cargarTickets();
  </script>
</body>
</html>
